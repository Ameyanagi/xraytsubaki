[package]
rust-version.workspace = true
name = "rexafs"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
description = "Rust-powered X-ray absorption spectroscopy analysis and EXAFS fitting"
keywords = ["xafs", "exafs", "spectroscopy", "xray", "science"]
categories = ["science"]
# Keep the beamline corpus and its integration tests in Git, outside the
# crates.io archive. Source-checkout tests read these fixtures from disk.
exclude = [
    "/tests/fixtures/xas/",
    "/tests/fixtures/sessions/",
    "/tests/fixtures/analysis/",
    "/tests/cu_mixture_recovery.rs",
    "/tests/peak_fitting.rs",
    "/tests/atomic_reference.rs",
    "/tests/mback_reference.rs",
    "/tests/fluorescence_reference.rs",
    "/tests/wavelet_reference.rs",
    "/tests/experimental_analysis_reference.rs",
    "/tests/beamline_formats.rs",
    "/tests/measurement_fixtures.rs",
    "/tests/measurement_fixtures/",
]

[dependencies]
semver = { workspace = true }
approx = { workspace = true }
data_reader = { workspace = true }
# easyfft = { workspace = true }
errorfunctions = { workspace = true }
ndarray = { version = "0.17.2", features = ["approx", "serde"], optional = true }
itertools = { workspace = true }
lazy_static = { workspace = true }
apex-solver = { workspace = true, optional = true }
faer = { version = "0.24", optional = true }
levenberg-marquardt = { workspace = true }
nalgebra = { workspace = true }
nalgebra-apex = { workspace = true, optional = true }
num-complex = { workspace = true }
polyfit-rs = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
bson = { workspace = true }
version = { workspace = true }
enterpolation = { workspace = true }
easyfft = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
flate2 = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
thiserror = { workspace = true }
ruviz = { workspace = true, optional = true, features = ["svg", "typst-math"] }
refeff = { workspace = true, optional = true }
# apex-io 0.3 (via apex-solver 1.4) links sqlite3 through rusqlite 0.31.
# Cargo permits only one libsqlite3-sys version in this workspace.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
ureq = { version = "3", features = ["json"], optional = true }
base64 = "0.23.1"
hdf5-pure = "0.47.0"
encoding_rs = "0.8"
regex = "1"
# Pin interpolation and the embedded atomic dataset as a processing-version input.
xraydb = "=0.4.1"
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = { version = "0.10", features = ["serde"] }
sha2 = "0.11"

[features]
default = ["trust-region"]
trust-region = ["dep:apex-solver", "dep:nalgebra-apex", "dep:faer"]
ndarray-compat = ["dep:ndarray"]
plotting = ["ruviz"]
refeff-runner = ["dep:refeff", "dep:ndarray"]
feff10-runner = ["dep:feff10"]
amcsd = ["dep:rusqlite"]
# HTTP client shared by the online structure sources.
http = ["dep:ureq"]
materials-project = ["http"]
cod = ["http"]

# The embedded FEFF10 library is a MinGW archive that the MSVC desktop cannot
# link. Windows builds keep the `feff10-runner` feature and run FEFF10 through
# the bundled `feff10-rs.exe` helper process instead; see fitting/runner.rs.
[target.'cfg(not(windows))'.dependencies]
feff10 = { workspace = true, optional = true }

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["flamegraph"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "xas_group_benchmark_single"
harness = false

[[bench]]
name = "xas_group_benchmark_parallel"
harness = false

[[bench]]
name = "autobk_stage_benchmark"
harness = false

[[example]]
name = "rmc_refeff"
required-features = ["refeff-runner"]

[[bench]]
name = "feff_fitting_batch_benchmark"
harness = false

[[example]]
name = "rmc_session"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_benchmark"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_cu2o"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_path_benchmark"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_prepared"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_cu2o_search"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_population_benchmark"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_cu2o_calibrate"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_adaptive"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_spectrum"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_qualify"
required-features = ["refeff-runner"]

[[example]]
name = "rmc_startup_benchmark"
required-features = ["refeff-runner"]
