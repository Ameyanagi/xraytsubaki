name: Release builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_qualification:
        description: Reusable PR callers default to full qualification; non-PR builds are always full
        type: boolean
        default: true
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A newer PR revision replaces its obsolete build. Each non-PR build keeps a
# separate group so a later release request cannot cancel it.
concurrency:
  group: release-build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: Select release checks
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check versions and CI selection safeguards
        run: |
          python scripts/check-release-version.py
          python scripts/test-ci-scope.py
          python scripts/test-ci-results.py
      - id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_FORCE_FULL: ${{ inputs.full_qualification || false }}
        run: |
          FLAGS=()
          if [ "$CI_FORCE_FULL" = true ]; then FLAGS+=(--force-full); fi
          python scripts/ci_scope.py --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD" \
            --github-output "$GITHUB_OUTPUT" "${FLAGS[@]}"

  licenses:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: '1.98.1'
          command: check licenses
          arguments: --locked --all-features
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Test the Apache sum_tree patch
        run: cargo test --locked --manifest-path vendor/sum_tree/Cargo.toml

  core:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: false
      - name: Clear cached package outputs and rebuild the workspace crate
        run: |
          rm -rf target/package target/distributions
          cargo clean --locked -p rexafs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check coordinated versions and the dispatched release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python scripts/check-release-version.py "$GITHUB_REF_NAME"
          else
            python scripts/check-release-version.py
          fi
      - run: python scripts/test-release-version.py
      - run: python scripts/test-release-maintenance.py
      - run: python scripts/test-registry-artifacts.py
      - run: python scripts/test-python-wheels.py
      - run: python scripts/test-release-downloads.py
      - run: python scripts/test-desktop-channels.py
      - run: python scripts/test-macos-installer.py
      - run: python scripts/test-benchmark-tools.py
      - name: Require retained compatibility fixtures for this release
        run: python scripts/check-compatibility-fixtures.py
      - name: Verify beamline fixtures and their package exclusions
        run: |
          python scripts/check-beamline-fixtures.py
          python scripts/check-beamline-fixtures.py --package
      - run: cargo test --locked -p rexafs
      - run: cargo test --locked -p rexafs --features ndarray-compat
      - run: cargo test --locked -p rexafs --features trust-region
      - run: cargo package --locked -p rexafs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-package
          path: target/package/rexafs-*.crate
          if-no-files-found: error

  python:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --locked --manifest-path py-rexafs/Cargo.toml --out dist --interpreter python3.12
          maturin-version: 'v1.12.6'
          manylinux: auto
          rust-toolchain: '1.98.1'
      - name: Require one wheel with the intended stable ABI and platform metadata
        run: python scripts/check-python-wheels.py dist --platform ${{ matrix.os }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  python-runtime:
    name: Python runtime (${{ matrix.os }}, ${{ matrix.runtime.python }})
    needs: [scope, python]
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        # Earliest NumPy wheel release for each supported CPython minor on all
        # three platforms. Latest NumPy is tested separately in the same job.
        runtime:
          - {python: '3.10', numpy: '1.23.0'}
          - {python: '3.11', numpy: '1.23.4'}
          - {python: '3.12', numpy: '1.26.0'}
          - {python: '3.13', numpy: '2.1.0'}
          - {python: '3.14', numpy: '2.3.3'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - run: python scripts/check-python-wheels.py dist --platform ${{ matrix.os }}
      - run: python -m pip install --no-index --find-links dist rexafs --no-deps
      - run: python -m pip install --only-binary=":all:" numpy==${{ matrix.runtime.numpy }}
      - name: Verify installed bytes and the minimum NumPy version
        run: python scripts/check-python-wheels.py dist --platform ${{ matrix.os }} --installed --numpy-version ${{ matrix.runtime.numpy }}
      - run: python py-rexafs/tests/test_api.py
      - run: python -m pip install --upgrade --only-binary=":all:" numpy
      - name: Verify the same wheel with the latest compatible NumPy
        run: python scripts/check-python-wheels.py dist --platform ${{ matrix.os }} --installed
      - run: python py-rexafs/tests/test_api.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.os == 'ubuntu-24.04' && matrix.runtime.python == '3.12'
        with:
          node-version: '24'
      - name: Check installed Python wheel completion and hover help
        if: matrix.os == 'ubuntu-24.04' && matrix.runtime.python == '3.12'
        shell: bash
        run: |
          npm --prefix js-rexafs ci
          REXAFS_PYTHON="$(python -c 'import sys; print(sys.executable)')" npm --prefix js-rexafs run test:python-editor

  sdist:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      # Use the installed compiler for Cargo metadata and the isolated sdist
      # rebuild. The repository toolchain file also requests lint/Wasm tools;
      # installing those implicitly can conflict with the runner's Clippy files.
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install maturin twine
      - run: maturin sdist --manifest-path py-rexafs/Cargo.toml --out dist
      - run: python scripts/check-python-sdist.py dist/*.tar.gz --require-abi3
      - run: twine check dist/*
      - run: python -m pip install dist/*.tar.gz
      - run: python py-rexafs/tests/test_api.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  npm:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Restore the pinned browser engine build tool
        id: wasm-pack-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-0.15.0
      - name: Install the browser engine build tool
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Verify the browser engine build tool version
        run: test "$(wasm-pack --version)" = "wasm-pack 0.15.0"
      - run: npm --prefix js-rexafs ci
      - run: npm --prefix js-rexafs run build
      - run: npm --prefix js-rexafs test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python js-rexafs/test/browser.py
      - run: npm pack
        working-directory: js-rexafs
      - run: node scripts/test-npm-package.mjs js-rexafs/rexafs-*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: js-rexafs/rexafs-*.tgz
          if-no-files-found: error

  desktop:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            features: refeff-runner,feff10-runner
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: refeff-runner,feff10-runner
          # Native ARM64 runners: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: refeff-runner,feff10-runner
          # The MSVC desktop cannot link the MinGW FEFF10 archive; Windows runs
          # FEFF10 through the bundled x64 helper executable. On Windows ARM64
          # the app and ReFEFF are native; FEFF10 requires Windows 11 emulation.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            features: refeff-runner,feff10-runner
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: refeff-runner,feff10-runner
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-${{ matrix.target }}
      REXAFS_EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1-${{ matrix.target }}
      - name: Restore compatible macOS dependencies
        if: runner.os == 'macOS'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        env:
          # Match the nightly cache environment; rust-toolchain.toml still
          # selects the pinned toolchain, whose actual identity is hashed.
          RUSTUP_TOOLCHAIN: ''
        with:
          shared-key: nightly-${{ matrix.target }}
          save-if: false
      - name: Clear cached packages and rebuild macOS workspace crates
        if: runner.os == 'macOS'
        run: |
          rm -rf target/package target/distributions
          cargo clean --locked --release -p rexafs -p rexafs-gui
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev libgtk-3-dev libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev fonts-dejavu-core mesa-vulkan-drivers xvfb xauth xdotool imagemagick
      - name: Stage the verified FEFF10 helper for Windows tests
        if: runner.os == 'Windows'
        run: python scripts/feff10_worker.py target/feff10-helper
      - name: Project compatibility, publication and desktop regressions
        env:
          # Source-tree tests find the helper here; packaging below must not
          # inherit it so the extracted bundle proves its own helper works.
          REXAFS_FEFF10_EXECUTABLE: ${{ runner.os == 'Windows' && format('{0}\target\feff10-helper\feff10-rs.exe', github.workspace) || '' }}
        run: cargo test --locked --release -p rexafs-gui --no-default-features --features ${{ matrix.features }}
      - name: Embedded FEFF runner, RMC parallelism and fitting integration
        env:
          REXAFS_FEFF10_EXECUTABLE: ${{ runner.os == 'Windows' && format('{0}\target\feff10-helper\feff10-rs.exe', github.workspace) || '' }}
        run: cargo test --locked --release -p rexafs --features refeff-runner,feff10-runner --test refeff_runner --test rmc_refeff --test feff10_s02k_parity
      - name: Archive regression checks
        run: python scripts/test-release-archive.py
      - run: cargo build --locked --release -p rexafs-gui --no-default-features --features ${{ matrix.features }}
      - run: python scripts/package-desktop.py
      - name: Exercise the packaged Linux GUI at laptop resolution
        if: runner.os == 'Linux'
        run: |
          python -m pip install Pillow
          for driver in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            export VK_DRIVER_FILES="$driver"
            break
          done
          xvfb-run -a -s "-screen 0 1366x768x24" python scripts/smoke-linux-gui.py \
            target/distributions/rexafs-*-unknown-linux-gnu/rexafs \
            crates/rexafs-gui/tests/fixtures/projects/rexafs-0.2.3-embedded.rxs
          xvfb-run -a -s "-screen 0 1366x768x24" python scripts/smoke-desktop-updater.py \
            target/distributions/rexafs-*-unknown-linux-gnu
      - name: Archive target-specific Linux GUI evidence
        if: always() && runner.os == 'Linux'
        run: |
          if [ -d target/gui-smoke ]; then
            tar -czf "target/linux-gui-smoke-${REXAFS_EXPECTED_TARGET}.tar.gz" -C target gui-smoke
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && runner.os == 'Linux'
        with:
          name: linux-gui-smoke-${{ matrix.target }}
          path: target/linux-gui-smoke-${{ matrix.target }}.tar.gz
          if-no-files-found: warn
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: runner.os == 'Windows'
        with:
          version: '0.12.3'
          python-version: '3.12'
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          uv run --no-project python scripts/test-windows-installer.py
          uv run --no-project python scripts/windows_installer.py target/distributions --bundle "target/distributions/rexafs-*-pc-windows-msvc"
      - name: Install, reinstall and uninstall Windows package
        if: runner.os == 'Windows'
        run: ./scripts/test-windows-installer.ps1 -Directory target/distributions -CheckUpdates
      - name: Qualify portable Windows update and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem target/distributions -Directory -Filter 'rexafs-*-pc-windows-msvc'
          if (@($bundle).Count -ne 1) { throw 'Expected one Windows bundle' }
          uv run --no-project python scripts/smoke-desktop-updater.py $bundle.FullName
      - name: Archive target-specific updater evidence
        if: always() && runner.os != 'macOS'
        shell: bash
        run: |
          if [ -d target/update-smoke ]; then
            tar -czf "target/update-smoke-${REXAFS_EXPECTED_TARGET}.tar.gz" -C target update-smoke
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && runner.os != 'macOS'
        with:
          name: update-smoke-${{ matrix.target }}
          path: target/update-smoke-${{ matrix.target }}.tar.gz
          if-no-files-found: warn
      - name: Build and smoke-test unsigned Mac installer preview
        if: runner.os == 'macOS'
        run: |
          python -m pip install -r scripts/macos-installer-requirements.txt
          python scripts/preview-macos-installer.py target/distributions/rexafs-*-apple-darwin installer-preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        with:
          name: installer-preview-${{ matrix.os }}
          path: installer-preview/*-preview.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/distributions/*.zip
            target/distributions/*.tar.gz
            target/distributions/*.sha256
            target/distributions/*-setup.exe
            target/distributions/*-setup.build.json
            target/distributions/*-setup.exe.qualification.json
          if-no-files-found: error

  manifest:
    needs: [scope, licenses, core, python, python-runtime, sdist, npm, desktop]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Hash every qualified distribution
        run: |
          python scripts/check-python-wheels.py artifacts --inventory
          python scripts/check-artifacts.py create artifacts SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: SHA256SUMS
          if-no-files-found: error

  result:
    name: Release checks
    if: always()
    needs: [scope, licenses, core, python, python-runtime, sdist, npm, desktop, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require all selected checks or an intentional documentation-only skip
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/check-ci-results.py --selector scope --jobs licenses core python python-runtime sdist npm desktop manifest
