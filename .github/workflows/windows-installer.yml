name: Windows installer

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'scripts/windows_installer.py'
      - 'scripts/windows-installer.iss'
      - 'scripts/test-windows-installer*'
      - 'scripts/release_archive.py'
      - 'scripts/feff10_worker.py'
      - 'website/src/data/release.json'
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'scripts/windows_installer.py'
      - 'scripts/windows-installer.iss'
      - 'scripts/test-windows-installer*'
      - 'scripts/release_archive.py'
      - 'scripts/feff10_worker.py'
      - 'website/src/data/release.json'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release with a qualified Windows ZIP (blank uses the website's verified stable release)
        type: string
        required: false
      target:
        description: Target of an existing release ZIP (ARM64 requires 0.2.5 or later)
        type: choice
        options: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
        default: x86_64-pc-windows-msvc
        required: true

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: ${{ inputs.target == 'aarch64-pc-windows-msvc' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 20
    env:
      INSTALLER_TARGET: ${{ inputs.target || 'x86_64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
          python-version: '3.12'
      - name: Python checks
        run: |
          uvx ruff@0.16.6 check scripts/windows_installer.py scripts/test-windows-installer.py
          uvx ruff@0.16.6 format --check scripts/windows_installer.py scripts/test-windows-installer.py
          uvx ty@0.0.78 check scripts/windows_installer.py scripts/test-windows-installer.py
          uv run --no-project python scripts/test-windows-installer.py
      - name: Build installer from the existing release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseTag = $env:REQUESTED_RELEASE_TAG
          if (-not $releaseTag) {
            $releaseTag = (Get-Content website/src/data/release.json -Raw | ConvertFrom-Json).tag
          }
          Write-Host "Wrapping the qualified Windows ZIP from $releaseTag"
          uv run --no-project python scripts/windows_installer.py windows-installer --release $releaseTag --target $env:INSTALLER_TARGET
      - name: Install, reinstall and uninstall the complete payload
        run: ./scripts/test-windows-installer.ps1 -Directory windows-installer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-installer-${{ env.INSTALLER_TARGET }}
          path: windows-installer/
          if-no-files-found: error
