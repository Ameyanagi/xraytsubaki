[package]
rust-version.workspace = true
name = "rexafs-wasm"
description = "WebAssembly bindings for the rexafs processing pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rexafs = { path = "../rexafs", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
