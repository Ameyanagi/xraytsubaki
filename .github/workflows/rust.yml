name: Rust

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: rust-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select Rust checks
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Verify selection and version rules
      run: |
        python scripts/check-release-version.py
        python scripts/test-ci-scope.py
        python scripts/test-ci-results.py
    - id: select
      env:
        CI_EVENT: ${{ github.event_name }}
        CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        python scripts/ci_scope.py --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD" \
          --scope-push --github-output "$GITHUB_OUTPUT"

  core:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: Core (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: ["1.98.1", stable]
        include:
          - os: windows-2025
            toolchain: "1.98.1"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ matrix.toolchain }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        shared-key: checks
        save-if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && runner.os == 'Linux' && matrix.toolchain == '1.98.1' }}
    - name: Run core crate tests
      run: cargo +${{ matrix.toolchain }} test --locked -p rexafs --verbose
    - name: Test optional ndarray compatibility backend
      if: runner.os == 'Linux' && matrix.toolchain == '1.98.1'
      run: cargo +${{ matrix.toolchain }} test --locked -p rexafs --features ndarray-compat
    - name: Check Windows benchmark portability
      if: runner.os == 'Windows'
      run: cargo +${{ matrix.toolchain }} check --locked -p rexafs --all-targets

  plotting:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: Core plotting (stable)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
    - name: Test core plotting feature
      run: cargo +stable test --locked -p rexafs --features plotting

  linux-desktop:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: Linux desktop compile (stable)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
    - name: Install Linux platform dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev libgtk-3-dev libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev
    - name: Check the native Linux GUI and accessibility adapter
      run: cargo +stable check --locked -p rexafs-gui --no-default-features --features refeff-runner,feff10-runner

  strict-gates:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: Strict Gates (stable)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Run strict clippy
      run: cargo +stable clippy --locked -p rexafs --all-targets -- -D warnings
    - name: Check formatting
      run: cargo +stable fmt --all -- --check
    - name: Check Python bindings crate
      run: cargo +stable check --locked --manifest-path py-rexafs/Cargo.toml --verbose
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Run repository hooks
      env:
        RUSTUP_TOOLCHAIN: stable
      run: |
        python -m pip install pre-commit==4.5.1
        pre-commit run --all-files
    - name: Keep beamline fixtures out of the crate archive
      run: python scripts/check-beamline-fixtures.py --package

  benchmark:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    needs: [scope, core, strict-gates]
    if: needs.scope.outputs.full == 'true'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
    - name: Run single benchmark
      run: cargo bench -p rexafs --bench xas_group_benchmark_single -- --noplot
    - name: Run parallel benchmark
      run: cargo bench -p rexafs --bench xas_group_benchmark_parallel -- --noplot
    # baseline.json also gates autobk_stage_legacy_lm and
    # autobk_stage_linear_direct, which live in this target. Without it their
    # estimates.json never exists and the gate fails as "missing" on every push.
    - name: Run AUTOBK stage benchmark
      run: cargo bench -p rexafs --bench autobk_stage_benchmark -- --noplot
    - name: Evaluate benchmark regression (informational on PR, blocking on push)
      run: |
        MODE="informational"
        if [ "${{ github.event_name }}" = "push" ]; then
          MODE="blocking"
        fi
        ./crates/rexafs/scripts/bench_regression_gate.sh "$MODE"
    - name: Upload benchmark artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: benchmark-artifacts
        path: |
          target/criterion
          target/bench-regression-summary.md

  result:
    name: Rust checks
    if: always()
    needs: [scope, core, plotting, linux-desktop, strict-gates, benchmark]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Require every selected job to pass
      env:
        CI_NEEDS_JSON: ${{ toJSON(needs) }}
      run: python scripts/check-ci-results.py --selector scope --jobs core plotting linux-desktop strict-gates benchmark
