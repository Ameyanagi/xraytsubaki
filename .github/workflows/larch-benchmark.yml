name: Larch comparison

on:
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/workflows/larch-benchmark.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/rexafs/**'
      - 'py-rexafs/**'
      - 'pyproject.toml'
      - 'scripts/benchmark-fixed-clamp.py'
      - 'scripts/study-autobk-clamps.py'
      - 'scripts/benchmark-larch.py'
      - 'doc/benchmarks/2026-09-07-clamp-study/raw-cases.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: larch-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  comparison:
    name: Fixed-lambda accuracy and speed
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install pinned scientific environment
        run: |
          uv venv .benchmark-env --python python3.12
          uv pip install --python .benchmark-env/bin/python maturin==1.12.6 xraylarch==2026.3.1 numpy==2.5.2 scipy==1.18.1 matplotlib==3.11.1 lmfit==1.3.4 threadpoolctl==3.6.0
      - name: Build production candidate
        run: |
          .benchmark-env/bin/maturin build --release --locked --interpreter .benchmark-env/bin/python --out target/benchmark-wheels
          uv pip install --python .benchmark-env/bin/python --no-deps target/benchmark-wheels/*.whl
      - name: Validate and measure candidate
        run: |
          .benchmark-env/bin/python scripts/benchmark-fixed-clamp.py --output target/larch-comparison
          uv pip freeze --python .benchmark-env/bin/python > target/larch-comparison/requirements-candidate.txt
      - name: Measure published 0.1.0 with the same dependencies
        run: |
          uv pip install --python .benchmark-env/bin/python --no-deps --reinstall rexafs==0.1.0
          .benchmark-env/bin/python scripts/benchmark-fixed-clamp.py --output target/larch-comparison --timing-only --published
      - name: Preserve results and profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixed-lambda-larch-comparison
          path: target/larch-comparison
          if-no-files-found: warn
          retention-days: 90
