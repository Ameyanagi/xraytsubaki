# Check the whole workspace on every platform, including optional integrations.
# Leaving targets unset includes all target-specific dependency branches.
[graph]
all-features = true

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.95
unused-allowed-license = "allow"
# Existing non-GPL license choices. SPDX OR alternatives are satisfied by an
# allowed choice; no GPL, AGPL or LGPL license is accepted by this policy.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "NCSA",
    "CC0-1.0", "CDLA-Permissive-2.0", "Unicode-3.0", "Zlib", "bzip2-1.0.6",
    "MPL-2.0", "CDDL-1.0",
]
