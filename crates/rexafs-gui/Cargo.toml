[package]
rust-version.workspace = true
name = "rexafs-gui"
publish = false
version.workspace = true
license.workspace = true
authors.workspace = true
# ruviz-gpui is edition 2024 / rust 1.92+; the GUI crate matches.
edition = "2024"

[[bin]]
name = "rexafs"
path = "src/main.rs"

[dependencies]
# gpui resolves (via the workspace `[patch.crates-io]`) to the single
# git-pinned gpui 0.2.2 (zed rev 3060e417...) shared with ruviz-gpui, so there
# is exactly one gpui in the tree.
gpui = { workspace = true }
# `pdf` converts composed publication figures from SVG to vector PDF.
ruviz = { workspace = true, features = ["typst-math", "pdf"] }
# LZW-compressed TIFF, with a DPI tag, for composed publication figures.
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
ruviz-gpui = { workspace = true }

# Platform entry point: gpui 0.2.2 has no zero-arg `Application::new()`; the
# public non-test entry point is `gpui_platform::application()`. Pinned to the
# SAME zed rev as the workspace gpui patch so its transitive gpui git dep is
# also patched -> one gpui. The `font-kit` feature lives on the platform
# backend (gpui_macos), forwarded via gpui_platform — without it, NO text
# renders on macOS (buttons/labels appear blank).
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3060e4170ea5ef0e6886b9ac1853aaead9ddd59f", package = "gpui_platform", features = ["font-kit", "wayland", "x11"] }

# Core crate: pipeline + fitting. Do NOT enable its `plotting` feature here;
# the GUI builds ruviz Plots itself in src/plotting/.
rexafs = { path = "../rexafs", default-features = true, features = ["amcsd", "materials-project", "cod"] }

accesskit = "0.25"
raw-window-handle = "0.6"
anyhow = "1.0"
base64 = "0.23"
flate2 = { workspace = true }
sha2 = "0.11.0"
chrono = "0.4.45"
csv = "1.4.0"
rusqlite = { version = "0.31", features = ["bundled"] }
xraydb = "0.4.1"
futures = "0.3"
rayon = { workspace = true }
lru = "0.18"
walkdir = "2.5"
tempfile = "3.27"
libc = "0.2"
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["json"] }
semver = { workspace = true }
unicode-segmentation = "1"
# Same nalgebra as the core crate (XASSpectrum exposes DVector<f64>).
nalgebra = { workspace = true }
serde = { workspace = true, features = ["rc"] }
# Project persistence must recover every stored f64 exactly, including subnormals.
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }

[features]
default = ["refeff-runner", "feff10-runner"]
refeff-runner = ["rexafs/refeff-runner"]
feff10-runner = ["rexafs/feff10-runner", "dep:feff10"]

# Windows runs FEFF10 through the bundled helper process (see the core crate),
# so the embedded library and its worker hook are only linked elsewhere.
[target.'cfg(not(windows))'.dependencies]
feff10 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.27"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.35"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit_unix = "0.23"
