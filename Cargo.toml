
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
  "crates/*",
  "py-xraytsubaki",
  # "examples/*",
]
# Keep plain `cargo build`/`cargo test` on the core crate; the GUI pulls the
# large gpui dependency tree and is built explicitly with `-p xraytsubaki-gui`.
default-members = ["crates/xraytsubaki"]
exclude = [
  # "examples/datasets",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ameyanagi <contact@ameyanagi.com>"]
homepage = "https://github.com/Ameyanagi/xraytsubaki"
repository = "https://github.com/Ameyanagi/xraytsubaki"
license = "MIT OR Apache-2.0"

[profile.bench]
debug = true

[profile.dev]
debug = 1
incremental = true
codegen-units = 256


[workspace.dependencies]
easyfft = { version = "0.4.2", features = ["serde"] }
semver = { version = "1.0.22" }
approx = "0.5.1"
data_reader = "0.5.0"
errorfunctions = "0.2.0"
ndarray = { version = "0.15.6", features = ["approx", "serde"] }
itertools = "0.12.0"
lazy_static = "1.4.0"
apex-solver = { version = "1.3.0", default-features = false }
levenberg-marquardt = "0.13.1"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
nalgebra-apex = { package = "nalgebra", version = "0.33" }
num-complex = { version = "0.4.5", features = ["serde"] }
polyfit-rs = "0.2.1"
rusty-fitpack = "0.1.2"
rayon = "1.8.1"
serde = { version = "1.0.197", features = ["derive"] }
serde_arrow = { version = "0.10.0", features = ["arrow2-0-17", "arrow-46"] }
serde_json = "1.0.114"
bson = "2.9.0"
version = "3.0.0"
derivative = "2.2.0"
flate2 = "1.0.28"
pest = "2.7.7"
pest_derive = "2.7.7"
thiserror = "1.0.69"
ruviz = { version = "0.12.1", default-features = false }
# GUI stack. `gpui = "0.2.2"` (latest on crates.io) is redirected by the
# [patch.crates-io] below to the git-pinned gpui (zed rev 3060e417...) that
# gpui_platform also resolves to, so the whole workspace shares exactly one gpui.
gpui = "0.2.2"
ruviz-gpui = { version = "0.12.1", features = ["gpu", "3d"] }
refeff = { version = "0.2.0", default-features = false, features = ["exafs"] }

xraytsubaki = { version = "0.1.0", path = "crates/xraytsubaki" }

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "3060e4170ea5ef0e6886b9ac1853aaead9ddd59f" }

[workspace.dependencies.enterpolation]
version = "0.2.1"
default-features = false
# re-enable all wanted features
features = ["std", "linear"]
