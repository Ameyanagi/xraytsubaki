name: Complete reviewed PyPI source release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag whose PyPI source upload was rejected for missing licenses
        type: string
        required: true
      build_run_id:
        description: Successful manually dispatched Release builds run for that tag
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python scripts/check-release-source.py "$RELEASE_TAG" "$BUILD_RUN_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-sdist
          path: original
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          path: manifest
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Restore only missing license files from the tagged source
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python scripts/repair-python-sdist.py original/*.tar.gz manifest/SHA256SUMS repaired --commit "$RELEASE_COMMIT"
      - name: Check metadata and install the repaired source distribution
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python scripts/check-python-sdist.py repaired/*.tar.gz
          python -m pip install twine
          twine check repaired/*.tar.gz
          python -m pip install repaired/*.tar.gz
          mkdir source-tests
          git archive "$RELEASE_COMMIT" py-rexafs/tests/test_api.py crates/rexafs/tests/testfiles/Ru_QAS.dat | tar -x -C source-tests
          python source-tests/py-rexafs/tests/test_api.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repaired-python-sdist
          path: repaired/*
          if-no-files-found: error

  publish:
    needs: repair
    runs-on: ubuntu-latest
    environment: pypi-repair
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repaired-python-sdist
          path: repaired
      - name: Verify and collect the source distribution
        run: |
          cd repaired
          sha256sum --check ./*.sha256
          mkdir ../dist
          cp ./*.tar.gz ../dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
